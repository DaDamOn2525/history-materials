<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정당 이합집산 — 세 사람의 강</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --bg2:#e8e5dd; --ink:#1c1a17; --ink-soft:#5c584f; --rule:#c9c3b6;
  --kim:#a8452f;   /* 김원봉 */
  --ji:#2f6a5c;    /* 지청천 */
  --koo:#2b4a72;   /* 김구 */
  --merge:#8a6d24; /* 합류점 */
  --panel:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --bg2:#1e1c16; --ink:#eae6db; --ink-soft:#a39c8c; --rule:#3a362c;
    --kim:#d6714f; --ji:#5aa392; --koo:#7396c2; --merge:#c1a054; --panel:#211f19;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --bg2:#1e1c16; --ink:#eae6db; --ink-soft:#a39c8c; --rule:#3a362c;
  --kim:#d6714f; --ji:#5aa392; --koo:#7396c2; --merge:#c1a054; --panel:#211f19;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",sans-serif; line-height:1.75; }
h1,h2,.myeong{ font-family:"Nanum Myeongjo",serif; }

header{ padding:clamp(22px,4vw,40px) clamp(18px,4vw,48px) 20px; border-bottom:1px solid var(--rule); background:var(--bg2); }
header p.kicker{ margin:0 0 8px; font-size:.82rem; color:var(--ink-soft); letter-spacing:.08em; }
header h1{ margin:0; font-size:clamp(1.5rem,3.6vw,2.2rem); font-weight:800; }
header .sub{ margin:10px 0 0; color:var(--ink-soft); font-size:.95rem; max-width:60ch; }

.legend{ display:flex; gap:22px; flex-wrap:wrap; margin-top:18px; font-size:.88rem; }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.legend i{ width:14px; height:14px; border-radius:50%; display:inline-block; }

.wrap{ display:grid; grid-template-columns:minmax(320px,460px) 1fr; gap:0; align-items:start; }
@media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }

.diagram-col{ position:sticky; top:0; padding:20px clamp(10px,2vw,28px); }
@media (max-width:900px){ .diagram-col{ position:static; } }
svg{ width:100%; height:auto; display:block; }

.node{ cursor:pointer; }
.node circle{ stroke:var(--bg); stroke-width:3; transition:r .15s; }
.node:hover circle, .node.active circle{ r:14; }
.node text{
  font-size:17px; font-weight:600; fill:var(--ink);
  font-family:"Noto Sans KR",sans-serif;
  paint-order:stroke; stroke:var(--bg); stroke-width:6px; stroke-linejoin:round;
}
.node.active text{ fill:var(--merge); font-weight:800; }
.flag{ font-size:14px; font-weight:500; fill:var(--ink-soft); font-style:italic;
  paint-order:stroke; stroke:var(--bg); stroke-width:6px; stroke-linejoin:round; }
.lane-label{ font-size:16px; font-weight:800; paint-order:stroke; stroke:var(--bg); stroke-width:6px; stroke-linejoin:round; }

.panel-col{ padding:24px clamp(16px,3vw,48px) 100px; }
.panel{ background:var(--panel); border:1px solid var(--rule); border-radius:2px; padding:clamp(20px,3vw,36px); max-width:66ch; }
.panel .tag{ display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:10px; }
.panel h2{ margin:0 0 18px; font-size:clamp(1.2rem,2.6vw,1.6rem); }
.panel .script{ white-space:pre-line; font-size:1.02rem; }
.panel .script b{ color:inherit; font-weight:700; }
.hint{ font-size:.85rem; color:var(--ink-soft); margin:14px 0 0 0; }
</style>
</head>
<body>

<header>
  <p class="kicker">한국사 · 1930년대 독립운동</p>
  <h1>정당 이합집산 — 세 사람의 강</h1>
  <p class="sub">1930년대 초부터 1942년 한국광복군 제1지대 편입까지, 김원봉·지청천·김구 세 사람이 만났다 흩어지기를 반복한 기록입니다. 왼쪽 다이어그램의 점을 눌러 각 장면을 읽어보세요.</p>
  <div class="legend">
    <span><i style="background:var(--kim)"></i>김원봉</span>
    <span><i style="background:var(--ji)"></i>지청천</span>
    <span><i style="background:var(--koo)"></i>김구</span>
    <span><i style="background:var(--merge)"></i>합류 지점</span>
  </div>
</header>

<div class="wrap">
  <div class="diagram-col">
    <svg viewBox="0 0 1140 1560" xmlns="http://www.w3.org/2000/svg">
      <!-- 김원봉 lane -->
      <path d="M170,70 C170,160 335,160 335,250 L335,540 C335,600 260,600 260,660 L260,1180 C260,1300 665,1300 665,1360 L665,1400"
            fill="none" stroke="var(--kim)" stroke-width="8" stroke-linecap="round"/>
      <!-- 화북 이동파 — 별도 노선으로 갈라짐 (죽은 가지) -->
      <path d="M260,1180 C220,1210 150,1230 110,1260"
            fill="none" stroke="var(--kim)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,7" opacity="0.6"/>
      <circle cx="110" cy="1260" r="6" fill="none" stroke="var(--kim)" stroke-width="2.5"/>
      <!-- 지청천 lane -->
      <path d="M500,70 C500,160 335,160 335,250 L335,540 C335,600 500,600 500,660 L500,700 C500,760 665,760 665,820 L665,1500"
            fill="none" stroke="var(--ji)" stroke-width="8" stroke-linecap="round"/>
      <!-- 김구 lane -->
      <path d="M830,70 L830,700 C830,760 665,760 665,820 L665,1500"
            fill="none" stroke="var(--koo)" stroke-width="8" stroke-linecap="round"/>

      <!-- lane labels (top) -->
      <text x="170" y="40" text-anchor="middle" class="lane-label" fill="var(--kim)">김원봉</text>
      <text x="500" y="40" text-anchor="middle" class="lane-label" fill="var(--ji)">지청천</text>
      <text x="830" y="40" text-anchor="middle" class="lane-label" fill="var(--koo)">김구</text>

      <!-- nodes -->
      <g class="node" data-key="intro">
        <circle cx="170" cy="70" r="10" fill="var(--kim)"/>
        <circle cx="500" cy="70" r="10" fill="var(--ji)"/>
        <circle cx="830" cy="70" r="10" fill="var(--koo)"/>
        <text x="500" y="110" text-anchor="middle">1931~32 · 세 사람, 각자 다른 문 안에</text>
      </g>

      <g class="node" data-key="n1935_7">
        <circle cx="335" cy="250" r="11" fill="var(--merge)"/>
        <text x="360" y="245">1935.7</text>
        <text x="360" y="267">민족혁명당 결성</text>
      </g>

      <g class="node" data-key="n1935_911">
        <circle cx="335" cy="400" r="8" fill="var(--ji)"/>
        <text x="360" y="405" class="flag">조소앙, 여기서 이탈</text>
        <circle cx="830" cy="400" r="11" fill="var(--koo)"/>
        <text x="855" y="395">1935.9~11</text>
        <text x="855" y="417">갈라짐 둘 (한국국민당)</text>
      </g>

      <g class="node" data-key="n1937">
        <circle cx="335" cy="540" r="11" fill="var(--ji)"/>
        <text x="360" y="535">1937</text>
        <text x="360" y="557">지청천, 문밖으로</text>
      </g>

      <g class="node" data-key="n1937_38">
        <circle cx="260" cy="660" r="10" fill="var(--kim)"/>
        <text x="60" y="640">1937~38</text>
        <text x="60" y="662">조선의용대</text>
        <path d="M120,650 L245,660" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="3,4"/>
      </g>

      <g class="node" data-key="n1937_8">
        <circle cx="665" cy="760" r="11" fill="var(--merge)"/>
        <text x="690" y="755">1937.8.1</text>
        <text x="690" y="777">우익, 다시 나란히</text>
      </g>

      <g class="node" data-key="n1940">
        <circle cx="665" cy="1080" r="11" fill="var(--merge)"/>
        <text x="690" y="1075">1940</text>
        <text x="690" y="1097">충칭 통합 · 광복군 창설</text>
        <circle cx="260" cy="1080" r="9" fill="var(--kim)"/>
        <path d="M120,1095 L245,1082" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="3,4"/>
        <text x="60" y="1105">김원봉 · 조선의용대</text>
        <text x="60" y="1127" class="flag">(이 통합에 미합류)</text>
      </g>

      <text x="130" y="1290" class="flag">조선의용군</text>
      <text x="130" y="1308" class="flag">(화북·별도 노선)</text>

      <g class="node" data-key="n1941_42">
        <circle cx="665" cy="1400" r="12" fill="var(--merge)"/>
        <text x="690" y="1395">1941~42</text>
        <text x="690" y="1417">화북과 충칭 사이</text>
      </g>
    </svg>
  </div>

  <div class="panel-col">
    <div class="panel" id="panel">
      <span class="tag" id="p-tag">1931~32</span>
      <h2 id="p-title">흩어진 이름들</h2>
      <div class="script" id="p-body"></div>
    </div>
    <p class="hint">다이어그램의 점을 눌러 다음 장면으로 이동하세요.</p>
  </div>
</div>

<script>
const SCENES = {
  intro: { tag:"1931~32", title:"흩어진 이름들", body:
`이름이 많았다.

의열단, 한국독립당, 신한독립당,
조선혁명당, 한국혁명당, 대한인독립당—
간판을 걸었다가, 내렸다가, 다시 걸었다.

같은 목표를 가진 사람들이,
같은 나라를 잃은 사람들이,
왜 이렇게 여러 개의 문 안에 나뉘어 있었을까.

문 안에는 각자의 사정이 있었다.
누구는 총을 들고 싸우자 했고,
누구는 외교로 세계를 설득하자 했고,
누구는 이 둘을 가를 수 없다고 했다.

이 많은 이름을 전부 기억할 필요는 없다.
다만 세 사람의 걸음만 따라가면 된다.

김구는 상하이의 골목에서,
지청천은 만주에서 관내로 넘어오는 길 위에서,
김원봉은 난징 근처 셋집에서,
각자 다른 문 안에 있었다.

이들은 아직, 서로의 이름을 당장 필요로 하지 않았다.` },

  n1935_7: { tag:"1935.7 · 첫 합류", title:"민족혁명당 결성", body:
`여름비가 그친 자리에, 습기가 남았다.
낯선 억양들이 문 앞에서 부딪쳤다 — 평안도 말, 경상도 말, 서울말.
누군가는 총을 만져본 손이었고,
누군가는 붓을 쥐던 손이었다.

한 사람씩, 방 안으로 들어섰다.
의자는 다섯 개의 서로 다른 이름 아래 놓였었다.
그러나 오늘은, 그 이름들을 문밖에 벗어두고 들어오기로 했다.

사람은 원래 자기가 서 있던 자리를 쉽게 떠나지 않는다.
그러나 떠나야 할 더 큰 이름이 나타나면,
그 작은 이름은 잠시, 물러난다.

서명이 한 장의 종이 위로 겹쳐졌다.
글씨체는 다섯 가지였지만,
종이는 한 장이었다.

지청천은 자신의 이름 옆에 '군무부장'이라는 직함이 놓이는 걸 지켜보았다.
그 옆줄에는, 김원봉의 이름이 있었다.

아직은, 나란히.` },

  n1935_911: { tag:"1935.9~11", title:"갈라짐 둘", body:
`9월, 조소앙은 민족혁명당을 나와 한국독립당을 다시 세웠다.
"당권이 한쪽으로 쏠렸다"는 것이 그가 남긴 이유였다.

11월, 김구는 애초에 들어가지 않았던 길 위에서
한국국민당을 세웠다.

한 장으로 접혔던 서명이,
넉 달 만에 다시 세 갈래로 펼쳐졌다.` },

  n1937: { tag:"1937 · 결별", title:"지청천, 문밖으로", body:
`정월, 민족혁명당 전당대회에서 표가 갈렸다.
지청천의 이름 옆에 있던 표들이,
김원봉의 이름 옆으로 옮겨갔다.

총서기라는 자리에,
지청천이 아닌 사람이 앉았다.

봄이 왔다.
중앙집행위원회 문이 닫힌 채로 오래 열리지 않았고,
열렸을 때는, 지청천의 이름이 당원 명단에서 지워져 있었다.
제명이었다.

그는 아무 말도 하지 않았다.
말을 삼키는 것도, 버티는 방법 중 하나였다.

여름, 장마가 늦게 왔다.
인쇄소에서 나온 당보(黨報) 위에,
민족혁명당의 깃발이 있어야 할 자리에
다른 깃발이 찍혀 있었다.
잉크는 아직 마르지 않았다.

사람은 작은 것에서 화내지 않는다.
이미 쌓아온 것이 있을 때,
작은 것이 마지막 계기가 될 뿐이다.

지청천은 그 종이를 오래 들여다보았다.
그리고 붓을 들어, '조선혁명당' 다섯 글자를
다른 종이에 옮겨 적었다.

정월부터 여름까지, 반년이었다.
반년 만에, 그는 민족혁명당 문밖에 있었다.` },

  n1937_8: { tag:"1937.8.1", title:"우익, 다시 나란히", body:
`중일전쟁이 터진 지 한 달.
한국독립당·한국국민당·조선혁명당,
갈라섰던 세 이름이 한국광복운동단체연합회라는
하나의 이름 아래 다시 나란히 섰다.

이번엔 하나의 정당이 아니라, 느슨한 연합이었다.
완전히 하나가 되는 대신, 손만 맞잡는 법을 익힌 것이다.` },

  n1937_38: { tag:"1937~38", title:"다른 강 위의 사람들", body:
`같은 해, 김원봉의 조직은
조선민족전선연맹으로 이름을 바꿨다.

이듬해, 그 아래 무장 조직 하나가 태어났다.
조선의용대.

우익의 연합이 나란히 서는 동안,
좌익의 깃발은 다른 강 위에서 홀로 서 있었다.` },

  n1940: { tag:"1940 · 두 번째 합류", title:"충칭, 그리고 광복군", body:
`두 강이 만나는 자리에 도시가 있었다.
양쯔강과 자링강, 흙빛과 잿빛이 한 물줄기로 섞이는 곳.

산을 깎아 지은 방공호 계단을,
김구가 오르고 있었다.
발밑에서 돌가루가 부서졌다.

같은 계단 위쪽에서 지청천이 내려오고 있었다.
둘은 계단 중턱에서 마주쳤다.
비켜서지 않고, 나란히 섰다.

5월, 한국독립당이라는 이름 아래
한국국민당·한국독립당(조소앙계)·조선혁명당,
세 개의 간판이 하나로 접혔다.
조소앙의 붓글씨가 새 강령 위에 남았다.

사람은 오래 같은 길을 걸으면,
어느 순간부터 "우리"라는 말을
따로 힘주지 않고도 쓰게 된다.

9월 17일, 충칭의 한 강당.
한국광복군 총사령부 깃발이 올라갔다.
지청천이 총사령관 자리에 섰다.
군복을 갖춰 입은 사람도 있었고,
평상복 그대로 줄을 선 사람도 있었다.

박수 소리가 강당 벽에 부딪혀 오래 남았다.

그러나 그 박수 속에,
없는 이름이 하나 있었다.

김원봉은 이 강당에 없었다.
그는 여전히, 다른 강 건너에서
조선의용대의 깃발을 들고 있었다.

두 강이 만나는 도시에서,
모든 물줄기가 한 곳으로 모이지는 않았다.` },

  n1941_42: { tag:"1941~42 · 세 번째 합류", title:"화북과 충칭 사이", body:
`1941년 봄, 황하가 녹았다.

강 건너 화북으로,
조선의용대 대원 다수가 걸어서 넘어갔다.
총을 메고, 뒤돌아보지 않았다.

김원봉은 충칭에 남았다.
같이 걷던 사람들의 등이,
강 저편으로 점점 작아졌다.

혼자였던 선(線)은,
혼자인 채로도 다시 갈라질 수 있었다.

이듬해 4월, 임시정부 국무회의.
"조선의용대를 광복군으로 합편할 것."
결의문에 도장이 찍혔다.

5월 13일, 광복군에 부사령이라는 자리가 새로 생겼다.
그 자리에, 김원봉의 이름이 놓였다.

7월, 조선의용대는 스스로 선언했다 —
"우리는 한국광복군 제1지대다."

지청천이 총사령관으로 서 있는 부대에,
김원봉이 부사령으로 나란히 섰다.

const nodes = document.querySelectorAll('.node');
const pTag = document.getElementById('p-tag');
const pTitle = document.getElementById('p-title');
const pBody = document.getElementById('p-body');

function show(key){
  const s = SCENES[key];
  if(!s) return;
  pTag.textContent = s.tag;
  pTitle.textContent = s.title;
  pBody.textContent = s.body;
  nodes.forEach(n => n.classList.toggle('active', n.dataset.key === key));
  document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

nodes.forEach(n => n.addEventListener('click', () => show(n.dataset.key)));
show('intro');
